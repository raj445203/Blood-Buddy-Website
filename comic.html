<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Page</title>
    <link rel="stylesheet" href="styles.css">
    <style>
     

        .comic-container {
            position: relative;
            width: 40%;
            max-width: 800px;
            text-align: center;
        }
        #comicImage{
            position: absolute;
            margin-left: 500px;
        }

        img {
            margin-top: 50px;
            margin-left: 500px;
            width: 1500px;
            height: 1000;
            align-items: center;
            align-content: center;
            
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 18px;
            outline: none;
            z-index: 1000;
        }


        .arrow.left {
            margin-top: 400px;
            margin-left: 450px;
            left: -50px;
            align-items: center;
            align-content: center;
            
        }

        .arrow.right {
            align-items: center;
            align-content: center;
            margin-top: 400px;
            margin-left: 300px;
            margin-right: -550px;
            right: -50px;
        }

        .arrow:hover {
            background-color: #60180f;
        }
    </style>
</head>
<body class="bg-gray-100">

   
      
    <header class="bg-red-600 text-white p-4">
        <div class="container mx-auto">
            <h1 class="text-3xl font-bold ">Blood Buddy</h1>
            <nav class="mt-2 flex w-screen justify-center items-center text-center">
                <ul class="flex space-x-10">
                    <li><a href="home.html" class="hover:underline">Home</a></li>
                    <li><a href="donor.html" class="hover:underline">Donor Registration Form</a></li>
                    <li><a href="center.html" class="hover:underline">Blood Center</a></li>
                    <li><a href="receiver.html" class="hover:underline">Find BLood Near You</a></li>
                    <li><a href="#" class="hover:underline">Gallery</a></li>
                    <li><a href="camps.html" class="hover:underline"> Camps</a></li>
                    <li><a href="comic.html" class="hover:underline">comic</a></li>
                    <li><a href="contact.html" class="hover:underline">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="comic-container">
        <button class="arrow left" onclick="prevImage()">&#10094;</button>
        <img id="comicImage" src="1.png" alt="Comic Image">
        <button class="arrow right" onclick="nextImage()">&#10095;</button>
    </div>

    <script>
        const images = 
        [
            '1.png',
            '2.png',
            '3.png',
            '4.png',
            '5.png',
            '6.png',
            '7.png',
            '8.png',
            '9.png',
            '10.png'

        ];

        let currentIndex = 0;

        function showImage(index) {
            const imageElement = document.getElementById('comicImage');
            imageElement.src = images[index];
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            showImage(currentIndex);
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showImage(currentIndex);
        }
    </script>

</body>
</html>
