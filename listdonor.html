<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Finder - Donor List</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            padding: 20px;
        }
        #h1L {
            color: #c0392b;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #c0392b;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-100">

   
      
    <header class="bg-red-600 text-white p-4">
        <div class="container mx-auto">
            <h1 class="text-3xl font-bold ">Blood Buddy</h1>
            <nav class="mt-2 flex w-screen justify-center items-center text-center">
                <ul class="flex space-x-10">
                    <li><a href="donor.html" class="hover:underline">Home</a></li>
                    <li><a href="donor.html" class="hover:underline">Donor Registration Form</a></li>
                    <li><a href="center.html" class="hover:underline">Blood Center</a></li>
                    <li><a href="receiver.html" class="hover:underline">Find BLood Near You</a></li>
                    <li><a href="#" class="hover:underline">Gallery</a></li>
                    <li><a href="camps.html" class="hover:underline"> Camps</a></li>
                    <li><a href="comic.html" class="hover:underline">Comic</a></li>
                    <li><a href="contact.html" class="hover:underline">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <h1 id="h1L">List of Donors</h1>

    <table>
        <thead>
            <tr>
                <th>Full Name</th>
                <th>Age</th>
                <th>Blood Type</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Location</th>
                <th>Availability</th>
            </tr>
        </thead>
        <tbody id="donorList">
            <!-- Donor data will be inserted here -->
        </tbody>
    </table>

    <script>
        // Retrieve donors from localStorage
        const donors = JSON.parse(localStorage.getItem('donors')) || [];

        const donorList = document.getElementById('donorList');

        // Display each donor in a table row
        donors.forEach(donor => {
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${donor.fullName}</td>
                <td>${donor.age}</td>
                <td>${donor.bloodType}</td>
                <td>${donor.email}</td>
                <td>${donor.phone}</td>
                <td>${donor.location}</td>
                <td>${donor.availability}</td>
            `;

            donorList.appendChild(row);
        });
    </script>

</body>
</html>
