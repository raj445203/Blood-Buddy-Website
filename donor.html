<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Donor - Blood Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <img src="blood-donation-logo-removebg.png" alt="Blood Finder Logo" class="logo">
        <h1>Blood Finder</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="donor.html">Become a Donor</a></li>
            <li><a href="receiver.html">Find Blood</a></li>
        </ul>
    </div>
    <div class="content">
        <h2>Donor Registration</h2>
        <p>Please fill in the form below to become a blood donor. Your details will help us connect you with those in need.</p>
        <form id="donor-form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required min="18" max="65">

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="blood-type">Blood Type:</label>
            <select id="blood-type" name="blood-type" required>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>

            <label for="contact">Contact Number:</label>
            <input type="tel" id="contact" name="contact" required pattern="[0-9]{10}" placeholder="10-digit phone number">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="address">Full Address:</label>
            <textarea id="address" name="address" required></textarea>

            <label for="city">City:</label>
            <input type="text" id="city" name="city" required>

            <label for="state">State/Province:</label>
            <input type="text" id="state" name="state" required>

            <label for="zip">ZIP/Postal Code:</label>
            <input type="text" id="zip" name="zip" required>

            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" name="weight" required min="50" max="150">

            <label for="last-donation">Date of Last Donation:</label>
            <input type="date" id="last-donation" name="last-donation" required>

            <label for="medical">Medical Conditions (if any):</label>
            <textarea id="medical" name="medical"></textarea>

            <label for="availability">Availability:</label>
            <select id="availability" name="availability" required>
                <option value="Available">Available Anytime</option>
                <option value="Weekdays">Weekdays Only</option>
                <option value="Weekends">Weekends Only</option>
            </select>

            <button type="submit">Submit</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
